name: Build NEON OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_NEON_GEMINI_API_KEY: ${{ secrets.NEON_GEMINI_API_KEY }}
      ORG_GRADLE_PROJECT_NEON_XKIRO_API_KEY: ${{ secrets.NEON_XKIRO_API_KEY }}
      ORG_GRADLE_PROJECT_NEON_ANTHROPIC_API_KEY: ${{ secrets.NEON_ANTHROPIC_API_KEY }}
      ORG_GRADLE_PROJECT_NEON_OPENAI_API_KEY: ${{ secrets.NEON_OPENAI_API_KEY }}
      ORG_GRADLE_PROJECT_NEON_GROQ_API_KEY: ${{ secrets.NEON_GROQ_API_KEY }}
      ORG_GRADLE_PROJECT_NEON_OPENROUTER_API_KEY: ${{ secrets.NEON_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Windows app
        shell: pwsh
        run: ./desktop/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-Desktop-Windows
          path: desktop/dist/NEON-OS-Desktop.exe
